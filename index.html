<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Rotina Pacaembu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: navegação lateral | área principal | assistente fixo à direita (empilha no celular) */
:root{
  --bg:#fdedf3; --surface:#fffafc; --soft:#fbdce8; --line:#f3c3d5;
  --fg:#3b2430; --muted:#8a6474; --accent:#e0457f; --accent-ink:#ffffff; --accent-soft:#fdd3e3; --accent-2:#ff8fb8;
  --red:#c62f4b; --red-soft:#fde0e5; --amber:#b86a0e; --amber-soft:#fdefd8;
  --green:#2f8a5b; --green-soft:#dcf3e6; --blue:#4a5fc1; --blue-soft:#e3e7fb;
  --display:"Young Serif",Georgia,serif; --body:"Figtree",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(120,40,70,.06),0 6px 20px rgba(120,40,70,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e1318; --surface:#2a1b22; --soft:#36222c; --line:#4a2f3c;
  --fg:#f7e6ed; --muted:#c09aab; --accent:#f27aa5; --accent-ink:#2a1019; --accent-soft:#4a2434; --accent-2:#ffb3cf;
  --red:#ff8196; --red-soft:#4a1f29; --amber:#f0b25c; --amber-soft:#43301a;
  --green:#6fd49d; --green-soft:#1c3a2a; --blue:#9aa8ff; --blue-soft:#262c4d; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1e1318; --surface:#2a1b22; --soft:#36222c; --line:#4a2f3c;
  --fg:#f7e6ed; --muted:#c09aab; --accent:#f27aa5; --accent-ink:#2a1019; --accent-soft:#4a2434; --accent-2:#ffb3cf;
  --red:#ff8196; --red-soft:#4a1f29; --amber:#f0b25c; --amber-soft:#43301a;
  --green:#6fd49d; --green-soft:#1c3a2a; --blue:#9aa8ff; --blue-soft:#262c4d; --shadow:none; color-scheme:dark}
/* progresso do dia, feriados, ponto, comemoração */
.prog{padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.prog-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.prog h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px}
.prog p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.pct{font-family:var(--display);font-weight:400;font-size:36px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.bar{height:16px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1);min-width:8px}
.prog.full .bar span{background:linear-gradient(90deg,var(--accent-2),var(--accent),var(--accent-2))}
.rot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check.late:not(.on){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ponto{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px dashed color-mix(in srgb,var(--accent) 35%,var(--line));padding-top:10px}
.ponto input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface)}
.ponto b{color:var(--fg);font-variant-numeric:tabular-nums}
.wd.wdhol{border-color:var(--accent);background:repeating-linear-gradient(135deg,var(--accent-soft) 0 7px,var(--surface) 7px 14px)}
.day.hol{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 7px,transparent 7px 14px)}
.holn{font-size:10.5px;color:var(--accent);font-weight:700;line-height:1.2}
.dup.hol{background:var(--accent-soft);color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td input{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg)}
.celebrate{position:fixed;inset:0;z-index:69;display:grid;place-items:center;pointer-events:none}
.celebrate div{background:var(--accent);color:var(--accent-ink);padding:22px 30px;border-radius:20px;text-align:center;box-shadow:0 18px 50px rgba(224,69,127,.4)}
.celebrate b{display:block;font-family:var(--display);font-weight:400;font-size:30px}
@media (prefers-reduced-motion:no-preference){.celebrate div{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;padding-block:20px 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}}
.brand{font-family:var(--display);font-size:22px;line-height:1.1;margin:0 0 2px}
.brand-sub{color:var(--muted);font-size:12px;margin:0 0 18px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start}
nav .tabs{display:flex;flex-direction:column;gap:4px}
@media (max-width:760px){nav{position:static}nav .tabs{flex-direction:row;flex-wrap:wrap}}
.tab{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:transparent;padding:9px 12px;border-radius:10px;text-align:left;font-weight:500;color:var(--muted)}
.tab:hover{background:var(--soft);color:var(--fg)}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.tab .n{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 7px;min-width:24px;text-align:center}
.store{margin-top:16px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--green)} .dot.warn{background:var(--amber)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--soft)}
/* contadores */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1400px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.stat:hover{transform:translateY(-1px)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--c)}
.stat span{font-size:12.5px;font-weight:700;color:var(--fg)}
.stat small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.zero{background:transparent;border:1px dashed var(--line);opacity:.42}
.stat.zero b{color:var(--muted)} .stat.zero span{color:var(--muted);font-weight:500}
.stat[aria-pressed="true"]{outline:2.5px solid var(--c);outline-offset:1px;opacity:1}
/* faixa da semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:700px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:74px}
.wd:hover{border-color:var(--accent)}
.wd.today{background:var(--accent-soft);border-color:var(--accent)}
.wd .wl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wd .wn{font-family:var(--display);font-size:20px;line-height:1}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%}
.day{cursor:pointer}.day:hover{background:var(--soft)}
.day .cnt{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--muted)}
.drawer-bg{position:fixed;inset:0;background:rgba(40,10,25,.32);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--bg);padding:20px max(16px,env(safe-area-inset-right,0px)) 40px 20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line)}
.drawer h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px;text-transform:capitalize}
.grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-top:4px}
/* calendário */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
@media (max-width:1000px){.cal-wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.cal-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px;flex-wrap:wrap}
.cal-top h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px;text-transform:capitalize}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));border-top:1px solid var(--line);min-width:650px}
.dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.day{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;background:transparent;border-top:0;border-left:0;text-align:left;vertical-align:top}
.day:nth-child(7n){border-right:0}
.day.out{opacity:.45}
.day.sel{background:var(--soft)}
.day .dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--accent);color:var(--accent-ink)}
.ev{font-size:11px;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--soft);color:var(--fg)}
.ev.fatal{background:var(--red-soft);color:var(--red);font-weight:600}
.ev.prazo{background:var(--amber-soft);color:var(--amber)}
.ev.pasta{background:var(--blue-soft);color:var(--blue)}
.ev.aud{background:var(--green-soft);color:var(--green)}
.ev.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.daylist{padding:14px;display:flex;flex-direction:column;gap:10px;align-self:start}
.daylist h4{margin:0;font-family:var(--display);font-weight:400;font-size:17px}
/* cartões de item */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.isdone{opacity:.62}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.who{font-weight:700;font-size:15px}
.proc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.grey{background:var(--soft);color:var(--muted)}
.obs{font-size:13px;margin:0}
.assunto{font-size:12px;background:var(--soft);border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.assunto span{min-width:0;overflow-wrap:anywhere}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.check{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:5px 10px;background:var(--surface);font-size:12.5px;font-weight:600}
.check .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:11px;flex:none}
.check.on{background:var(--green-soft);border-color:transparent;color:var(--green)}
.check.on .box{background:var(--green);border-color:var(--green);color:var(--surface)}
.check.alt.on{background:var(--blue-soft);color:var(--blue)} .check.alt.on .box{background:var(--blue);border-color:var(--blue)}
.check small{font-weight:500;font-family:var(--mono);font-size:11px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.steps .check{justify-content:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 9px;font-size:12px}
.chip.on{background:var(--red-soft);color:var(--red);border-color:transparent;font-weight:600}
.chip.f.on{background:var(--accent);color:var(--accent-ink)}
.muted{color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.filters{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.filters label{font-size:12px;color:var(--muted);font-weight:600}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px}
details summary{cursor:pointer;color:var(--muted);font-weight:600;padding:4px 0}
/* chat */
.chat{display:flex;flex-direction:column;position:fixed;z-index:45;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));height:min(620px,calc(100vh - 120px));box-shadow:0 12px 40px rgba(120,40,70,.22)}
.chat-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fab{position:fixed;z-index:46;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:58px;padding:0 20px 0 16px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(217,70,122,.38)}
.fab svg{width:24px;height:24px}
.fab:hover{filter:brightness(1.05)}
.chat-h h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px}
.chat-h p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.prop{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.prop select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--surface);font-size:12px}
.dup{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:600}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;min-height:74px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg)}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(40,10,25,.38);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(620px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--bg);width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.prop{animation:in .18s ease-out}@keyframes in{from{transform:translateY(3px)}to{transform:none}}}
</style>

<div class="app">
  <nav>
    <p class="brand">Rotina<br>Pacaembu</p>
    <p class="brand-sub">Prazos, pastas e cadastros</p>
    <div class="tabs" id="tabs"></div>
    <div class="store"><span class="dot" id="storeDot"></span><span id="storeTxt">Conectando…</span></div>
  </nav>
  <main id="main"></main>
  <aside class="chat panel" id="chat" hidden>
    <div class="chat-h"><div><h3>Assistente</h3><p>Escreva como se falasse comigo. Ele separa os campos e você confirma antes de salvar.</p></div><button class="btn small ghost" id="chatClose" aria-label="Fechar assistente">✕</button></div>
    <div class="msgs" id="msgs"></div>
    <form class="composer" id="composer">
      <textarea id="chatIn" placeholder="Ex.: Reclamante Ana Souza, processo 0010000-11.2026.5.15.0001, solicitei docs hoje, prazo fatal 10/11, cobrar Solange"></textarea>
      <div class="row"><span class="muted" style="font-size:11.5px" id="aiMode">Leitura automática</span><button class="btn primary" type="submit" id="sendBtn">Enviar</button></div>
    </form>
  </aside>
</div>
<button class="fab" id="fab" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 12h.01M15 12h.01M9.5 15.5h5"/></svg><span id="fabTxt">Assistente</span></button>
<div id="dayRoot"></div>
<div id="modalRoot"></div>

<script>
const CHECKLIST=["CTPS","ASOs (admissional e demissional)","Contrato de Trabalho","Acordo/compensação de horas","VT","Ficha de Registro","Ordem de Serviços","Fichas de EPI","Treinamentos/Certificados","Integrações","Transferências","Cartões de Ponto","Holerites","TRCT e comprovante","SEFIPs","Contratos"];
const TIPOS={prazo:"Prazos",docs:"Solicitação de documentos",semaud:"Cadastrados sem audiência",cadastro:"Processos para cadastrar",ok:"Sem pendências"};
const STEPS=[["datajuri","Cadastro no Data Júri"],["contratos","Solicitado contratos"],["documentos","Solicitado documentos"],["pastaRT","Criada pasta de RT"],["pastaSub","Criada pasta de subsídios"],["pauta","Colocado na pauta de audiência"],["audiencia","Cadastrada audiência"]];

let items=[], view="painel", calMonth=null, selDay=null, statFilter=null, docFilter=[], search="";
let col=null, sample=null, localMode=false, diasCol=null, dias={}, itemsLoaded=false, diasLoaded=false, lastPct=null;

/* ---------- datas ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const br=s=>s?s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4):"";
const brs=s=>s?s.slice(8,10)+"/"+s.slice(5,7):"";
const addDays=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return iso(d)};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
/* feriados nacionais + SP; Carnaval e Corpus Christi são ponto facultativo */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return iso(new Date(y,mo-1,da))}
const HOLCACHE={};
function holidaysOf(y){if(HOLCACHE[y])return HOLCACHE[y];const H={};
  [["01-01","Confraternização Universal"],["04-21","Tiradentes"],["05-01","Dia do Trabalho"],["07-09","Revolução Constitucionalista (SP)"],["09-07","Independência do Brasil"],["10-12","Nossa Senhora Aparecida"],["11-02","Finados"],["11-15","Proclamação da República"],["11-20","Consciência Negra"],["12-25","Natal"]].forEach(([md,n])=>H[y+"-"+md]=n);
  const E=easter(y);H[addDays(E,-48)]="Carnaval (ponto facultativo)";H[addDays(E,-47)]="Carnaval (ponto facultativo)";H[addDays(E,-2)]="Sexta-feira Santa";H[addDays(E,60)]="Corpus Christi (ponto facultativo)";
  return HOLCACHE[y]=H}
const holidayOf=s=>s?holidaysOf(Number(s.slice(0,4)))[s]||null:null;
function dateWarnings(dates){return [...new Set(dates.filter(Boolean))].map(s=>{const h=holidayOf(s);const wd=new Date(s+"T12:00").getDay();
  if(h)return `<div class="dup hol">${br(s)} é feriado: ${esc(h)}. Provavelmente você não vai trabalhar nesse dia.</div>`;
  if(wd===0||wd===6)return `<div class="dup hol">${br(s)} cai num ${wd===0?"domingo":"sábado"}.</div>`;return ""}).join("")}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- regras ---------- */
function isDone(it){
  if(it.tipo==="ok") return true;
  if(it.tipo==="prazo") return !!it.concluido;
  if(it.tipo==="docs"||it.tipo==="semaud") return !!it.enviado;
  return false;
}
function events(it){
  const ev=[], nm=it.reclamante||it.processo||"Sem nome";
  if(it.prazo) ev.push({d:it.prazo,k:"prazo",t:(it.tipo==="docs"?"Cobrar · ":"Prazo · ")+nm});
  if(it.fatal) ev.push({d:it.fatal,k:"fatal",t:"Fatal · "+nm});
  if(it.montarPasta) ev.push({d:it.montarPasta,k:"pasta",t:"Montar pasta · "+nm});
  if(it.audiencia) ev.push({d:it.audiencia,k:"aud",t:"Audiência · "+nm});
  if(it.tipo==="cadastro"&&!it.prazo&&!it.fatal&&it.criadoEm) ev.push({d:it.criadoEm.slice(0,10),k:"cad",t:"Cadastrar · "+nm});
  if(it.tipo==="semaud"&&it.dataSolic&&!it.prazo&&!it.fatal) ev.push({d:it.dataSolic,k:"cad",t:"Solicitado · "+nm});
  ev.forEach(e=>{e.it=it;e.done=isDone(it)});
  return ev;
}
function urgency(it){
  if(isDone(it)) return {cls:"green",txt:"Concluído",lvl:0};
  const t=today(), ds=[it.prazo,it.fatal,it.montarPasta].filter(Boolean).sort();
  const lim=it.fatal||it.prazo||it.montarPasta;
  if(lim && lim<t) return {cls:"red",txt:"Vencido",lvl:4};
  if(it.fatal===t) return {cls:"red",txt:"Fatal hoje",lvl:3};
  if(ds.includes(t)) return {cls:"amber",txt:"Hoje",lvl:2};
  if(ds.some(d=>d>t&&d<=addDays(t,3))) return {cls:"blue",txt:"Atenção",lvl:1};
  if(it.tipo==="cadastro") return {cls:"grey",txt:"A cadastrar",lvl:0};
  return {cls:"grey",txt:"No prazo",lvl:0};
}
const STATS=[
  ["vencido","Vencidos","var(--red)",it=>urgency(it).lvl===4],
  ["fatal","Fatal hoje","var(--red)",it=>urgency(it).lvl===3],
  ["hoje","Pendências hoje","var(--amber)",it=>urgency(it).lvl>=2],
  ["atencao","Atenção (3 dias)","var(--blue)",it=>urgency(it).lvl===1],
  ["docs","Aguardando docs","var(--accent)",it=>(it.tipo==="docs"||it.tipo==="semaud")&&!isDone(it)],
  ["cadastro","Para cadastrar","var(--muted)",it=>it.tipo==="cadastro"]
];
function sortItems(a,b){const ua=urgency(a).lvl,ub=urgency(b).lvl;if(ua!==ub)return ub-ua;const da=a.fatal||a.prazo||a.montarPasta||"9",db=b.fatal||b.prazo||b.montarPasta||"9";return da<db?-1:da>db?1:0}
const normProc=s=>String(s||"").replace(/\D/g,"");
const normName=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
function findDups(p){
  const np=normProc(p.processo), nn=normName(p.reclamante);
  const byProc=np?items.filter(i=>normProc(i.processo)===np):[];
  const byName=nn?items.filter(i=>!byProc.includes(i)&&normName(i.reclamante)===nn):[];
  return {byProc,byName};
}

/* ---------- armazenamento ---------- */
function setStore(state,txt){storeDot.className="dot "+state;storeTxt.textContent=txt}
async function boot(){
  render();
  let db=null;
  try{db=window.claude?.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){localMode=true;try{items=JSON.parse(localStorage.getItem("rp_items")||"[]");dias=JSON.parse(localStorage.getItem("rp_dias")||"{}")}catch(e){items=[]}
    itemsLoaded=diasLoaded=true;setStore("warn","Modo local: salvo só neste navegador");render();}
  else{
    col=db.collection("itens");diasCol=db.collection("dias");
    const timer=setTimeout(()=>setStore("warn","Sem conexão com o banco ainda…"),10000);
    col.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache){clearTimeout(timer);setStore("ok","Salvo na nuvem");itemsLoaded=true}render()},
      e=>{clearTimeout(timer);setStore("warn","Erro no banco: "+(e.code||""));});
    diasCol.onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());dias=m;if(!s.metadata.fromCache)diasLoaded=true;render()},e=>{diasLoaded=true});
  }
  try{sample=window.claude?.use?await window.claude.use("sample"):null}catch(e){sample=null}
  aiMode.textContent=sample?"IA ativa":"Leitura automática (sem IA)";
}
function persistLocal(){try{localStorage.setItem("rp_items",JSON.stringify(items))}catch(e){}}
async function saveItem(it){
  const data={...it};delete data.id;
  if(!it.id) it.id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(localMode){const ix=items.findIndex(x=>x.id===it.id);if(ix>=0)items[ix]={...it};else items.push({...it});persistLocal();render();return}
  try{await col.doc(it.id).set(data)}catch(e){toast("Não consegui salvar: "+(e.message||e.code))}
}
async function saveDia(id,patch){
  const cur={...(dias[id]||{}),...patch};dias={...dias,[id]:cur};
  if(localMode){try{localStorage.setItem("rp_dias",JSON.stringify(dias))}catch(e){}render();return}
  render();try{await diasCol.doc(id).set(cur)}catch(e){toast("Não consegui salvar o ponto")}
}
const completedOn=it=>it.concluido||it.enviado||it.okEm||null;
function dayProgress(){
  const t=today();const due=i=>[i.prazo,i.fatal,i.montarPasta].some(d=>d&&d<=t);
  const L=items.filter(i=>(!isDone(i)&&urgency(i).lvl>=2)||(isDone(i)&&completedOn(i)===t&&due(i)));
  const dia=dias[t]||{};const total=L.length+2;const done=L.filter(isDone).length+(dia.manha?1:0)+(dia.fim?1:0);
  return {L,dia,total,done,pct:Math.round(done/total*100)};
}
function checkCelebrate(){
  if(!itemsLoaded||!diasLoaded)return;const p=dayProgress().pct;
  if(lastPct!==null&&lastPct<100&&p===100)celebrate();lastPct=p;
}
function celebrate(){
  const msg=document.createElement("div");msg.className="celebrate";msg.innerHTML=`<div><b>Sem pendências hoje!</b>Tudo concluído. Pode respirar, Le.</div>`;document.body.appendChild(msg);setTimeout(()=>msg.remove(),3200);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;z-index:70;pointer-events:none";document.body.appendChild(c);
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,x=c.getContext("2d");
  const cols=["#e0457f","#ff8fb8","#ffc2d9","#f9a8d4","#ffffff","#d63384","#fbcfe8"];
  const P=Array.from({length:180},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.55,vx:(Math.random()-.5)*26,vy:-Math.random()*30-12,s:(Math.random()*8+5)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.9;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(++f<170)requestAnimationFrame(tick);else c.remove()})();
}
function progCard(){
  const {L,dia,total,done,pct}=dayProgress();const h=new Date().getHours();
  const rot=(k,label,late)=>`<button class="check ${dia[k]?"on":""} ${late?"late":""}" data-rot="${k}"><span class="box">${dia[k]?"✓":""}</span>${label}${dia[k]?` <small>${dia[k]}</small>`:""}</button>`;
  return `<section class="prog panel ${pct===100?"full":""}"><div class="prog-top"><div><h3>${pct===100?"Sem pendências hoje!":"Progresso de hoje"}</h3><p>${done} de ${total} tarefas concluídas${pct<100?` · faltam ${total-done}`:""}</p></div><b class="pct">${pct}%</b></div>
   <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
   <div class="rot">${rot("manha","Manhã: enviar tarefas do dia no Teams",h>=10)}${rot("fim","Fim do dia: enviar o que foi feito, o que não foi e por quê",h>=17)}</div>
   <div class="ponto"><span>Ponto de hoje</span><label for="entrada">Entrada</label><input type="time" id="entrada" value="${esc(dia.entrada||"")}"><span>Saída <b>${dia.saida||"marca ao enviar o relatório do fim do dia"}</b></span><button class="btn small ghost" data-v="ponto">Ver registros</button></div></section>`;
}
function renderPonto(){
  const ks=Object.keys(dias).sort().reverse();
  return `<div class="head"><div><h2>Registro de ponto</h2><p>A saída é gravada quando você marca o envio do fim do dia. A entrada você coloca à mão.</p></div></div>
  <div class="panel">${ks.length?`<div class="tbl-wrap"><table><thead><tr><th>Dia</th><th>Entrada</th><th>Saída</th><th>Tarefas da manhã</th><th>Relatório do fim do dia</th></tr></thead><tbody>${ks.map(k=>{const d=dias[k];const hol=holidayOf(k);
    return `<tr><td><b>${br(k)}</b> <span class="muted">${new Date(k+"T12:00").toLocaleDateString("pt-BR",{weekday:"short"})}</span>${hol?` <span class="holn">${esc(hol)}</span>`:""}</td><td><input type="time" data-pd="${k}" data-pk="entrada" value="${esc(d.entrada||"")}" aria-label="Entrada ${br(k)}"></td><td><input type="time" data-pd="${k}" data-pk="saida" value="${esc(d.saida||"")}" aria-label="Saída ${br(k)}"></td><td>${d.manha?`<span class="pill green">enviado ${d.manha}</span>`:`<span class="pill red">não enviado</span>`}</td><td>${d.fim?`<span class="pill green">enviado ${d.fim}</span>`:`<span class="pill red">não enviado</span>`}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty" style="margin:14px">Nenhum registro ainda. Coloque sua entrada no Painel e marque o envio do fim do dia.</div>`}</div>`;
}
async function removeItem(id){
  if(localMode){items=items.filter(i=>i.id!==id);persistLocal();render();return}
  try{await col.doc(id).delete()}catch(e){toast("Não consegui excluir")}
}

/* ---------- ações ---------- */
function clone(it){return JSON.parse(JSON.stringify(it))}
function toggleField(id,field){
  const it=clone(items.find(i=>i.id===id));it[field]=it[field]?null:today();
  saveItem(it);toast(it[field]?"Marcado em "+br(it[field]):"Desmarcado");
}
function toggleStep(id,key){
  const it=clone(items.find(i=>i.id===id));it.checks=it.checks||{};
  if(key==="contratosNA"){it.checks.contratosNA=!it.checks.contratosNA;if(it.checks.contratosNA)it.checks.contratos=null}
  else if(key==="semAudiencia"){it.checks.semAudiencia=!it.checks.semAudiencia;if(it.checks.semAudiencia){it.checks.audiencia=null;it.checks.pauta=null}}
  else{it.checks[key]=it.checks[key]?null:today();if(key==="contratos"&&it.checks.contratos)it.checks.contratosNA=false;if((key==="audiencia"||key==="pauta")&&it.checks[key])it.checks.semAudiencia=false}
  const c=it.checks;
  const base=c.datajuri&&(c.contratos||c.contratosNA)&&c.documentos&&c.pastaRT&&c.pastaSub;
  if(base&&c.semAudiencia){it.tipo="semaud";it.dataSolic=it.dataSolic||c.documentos;it.enviado=null;saveItem(it);toast("Cadastro completo → Cadastrados sem audiência");return}
  if(base&&c.pauta&&c.audiencia){it.tipo="ok";it.okEm=today();saveItem(it);toast("Cadastro completo → Sem pendências");return}
  saveItem(it);
}
function toggleFalta(id,doc){
  const it=clone(items.find(i=>i.id===id));const f=new Set(it.faltando||[]);f.has(doc)?f.delete(doc):f.add(doc);it.faltando=CHECKLIST.filter(d=>f.has(d));saveItem(it);
}
function copy(txt,btn){navigator.clipboard?.writeText(txt).then(()=>toast("Assunto copiado")).catch(()=>toast("Selecione o texto para copiar"))}

/* ---------- render ---------- */
const NAV=[["painel","Painel e calendário"],["prazo",TIPOS.prazo],["docs",TIPOS.docs],["semaud",TIPOS.semaud],["cadastro",TIPOS.cadastro],["ok",TIPOS.ok],["ponto","Registro de ponto"]];
function render(){
  tabs.innerHTML=NAV.map(([k,l])=>{const n=k==="painel"?dayProgress().pct+"%":k==="ponto"?Object.keys(dias).length:items.filter(i=>i.tipo===k&&(k==="ok"||!isDone(i))).length;
    return `<button class="tab" data-v="${k}" aria-current="${view===k}"><span>${l}</span><span class="n">${n}</span></button>`}).join("");
  main.innerHTML=view==="painel"?renderPainel():view==="ponto"?renderPonto():renderLista(view);
  renderDrawer();checkCelebrate();
}
function statsBar(){
  return `<div class="stats">${STATS.map(([k,l,c,f])=>{const L=items.filter(f);const names=[...new Set(L.map(i=>(i.reclamante||"").split(" ")[0]).filter(Boolean))].join(", ");
    return `<button class="stat ${L.length?"":"zero"}" style="--c:${c}" data-stat="${k}" aria-pressed="${drawer&&drawer.stat===k}"><b>${pad(L.length)}</b><span>${l}</span><small>${L.length?esc(names):"nada pendente"}</small></button>`}).join("")}</div>`;
}
const EVC={fatal:"var(--red)",prazo:"var(--amber)",pasta:"var(--blue)",aud:"var(--green)",cad:"var(--muted)"};
let drawer=null;
function renderDrawer(){
  if(!drawer){dayRoot.innerHTML="";return}
  const t=today();let title,sub="",groups=[];
  if(drawer.day){const s=drawer.day;title=new Date(s+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
    const ev=items.flatMap(events).filter(e=>e.d===s);
    const G=[["fatal","Prazo fatal"],["prazo","Prazos e cobranças"],["pasta","Montar pasta"],["aud","Audiências"],["cad","Cadastros e solicitações"]];
    G.forEach(([k,l])=>{const its=[...new Set(ev.filter(e=>e.k===k).map(e=>e.it))];if(its.length)groups.push([l,its])});
    if(s===t){const late=items.filter(i=>urgency(i).lvl===4&&!ev.some(e=>e.it===i));if(late.length)groups.unshift(["Vencidos (de dias anteriores)",late])}
    const n=new Set(groups.flatMap(g=>g[1])).size;sub=n?`${n} ${n>1?"itens":"item"} neste dia`:"Nenhum prazo ou tarefa neste dia.";
    const hol=holidayOf(s);if(hol)sub=`<span class="holn" style="font-size:13px">Feriado: ${esc(hol)}</span><br>`+sub;}
  else{const st=STATS.find(x=>x[0]===drawer.stat);title=st[1];const L=items.filter(st[3]).sort(sortItems);groups=L.length?[["",L]]:[];sub=L.length?`${L.length} ${L.length>1?"itens":"item"}`:"Nada aqui.";}
  dayRoot.innerHTML=`<div class="drawer-bg" id="dbg"><div class="drawer" role="dialog" aria-label="${esc(title)}">
   <div class="card-top"><div><h3>${esc(title)}</h3><p class="muted" style="margin:2px 0 0">${sub}</p></div><button class="btn small" data-dclose="1">Fechar</button></div>
   ${drawer.day?`<div class="actions"><button class="btn small primary" data-newday="${drawer.day}">+ Tarefa neste dia</button></div>`:""}
   ${groups.map(([l,its])=>`${l?`<div class="grp">${esc(l)}</div>`:""}<div class="list">${its.sort(sortItems).map(card).join("")}</div>`).join("")}
  </div></div>`;
  dbg.onclick=e=>{if(e.target.id==="dbg"){drawer=null;render()}};
}
function renderPainel(){
  const t=today();if(!calMonth)calMonth=t.slice(0,7);if(!selDay)selDay=t;
  const [y,m]=calMonth.split("-").map(Number);const first=new Date(y,m-1,1);const start=new Date(first);start.setDate(1-first.getDay());
  const allEv=items.flatMap(events);
  let cells="";
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=iso(d);const ev=allEv.filter(e=>e.d===s).sort((a,b)=>a.done-b.done);
    const hol=holidayOf(s);
    cells+=`<button class="day ${s.slice(0,7)!==calMonth?"out":""} ${s===t?"today":""} ${s===selDay?"sel":""} ${hol?"hol":""}" data-day="${s}"><span style="display:flex;align-items:center"><span class="dn">${d.getDate()}</span>${ev.length?`<span class="cnt">${ev.length}</span>`:""}</span>${hol?`<span class="holn">${esc(hol)}</span>`:""}${ev.slice(0,3).map(e=>`<span class="ev ${e.k} ${e.done?"done":""}">${esc(e.t)}</span>`).join("")}${ev.length>3?`<span class="more">+${ev.length-3}</span>`:""}</button>`}
  const mName=first.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const hoje=items.filter(i=>urgency(i).lvl>=2).sort(sortItems);
  const side=`<h4>Para hoje</h4><p class="muted" style="margin:-6px 0 0;font-size:12px">Vencidos, fatais e prazos do dia</p>${hoje.length?hoje.map(card).join(""):`<div class="empty">Tudo em dia hoje.</div>`}`;
  let week="";for(let i=0;i<7;i++){const s=addDays(t,i);const ev=allEv.filter(e=>e.d===s&&!e.done);const dd=new Date(s+"T12:00");
    const hol=holidayOf(s);
    week+=`<button class="wd ${i===0?"today":""} ${hol?"wdhol":""}" data-day="${s}"><span class="wl">${i===0?"Hoje":i===1?"Amanhã":dd.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","")}</span><span class="wn">${pad(dd.getDate())}</span>${hol?`<span class="holn">${esc(hol)}</span>`:""}<span class="dots">${ev.map(e=>`<i style="background:${EVC[e.k]}" title="${esc(e.t)}"></i>`).join("")||`<span class="muted" style="font-size:11px">livre</span>`}</span></button>`}
  const h=new Date().getHours();const saud=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";
  return `<div class="head"><div><h2>${saud}, Le</h2><p>${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})} · ${hoje.length?`${hoje.length} ${hoje.length>1?"coisas pedem":"coisa pede"} atenção hoje`:"nada urgente hoje"}</p></div><button class="btn primary" data-new="prazo">+ Novo prazo</button></div>
  ${progCard()}
  ${statsBar()}
  <div class="week">${week}</div>
  <div class="cal-wrap"><div class="panel"><div class="cal-top"><h3>${mName}</h3><div class="actions"><button class="btn small" data-cal="-1" aria-label="Mês anterior">‹</button><button class="btn small" data-cal="0">Hoje</button><button class="btn small" data-cal="1" aria-label="Próximo mês">›</button></div></div>
  <div class="cal-scroll"><div class="cal">${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div></div>
  <div class="legend"><span><i style="background:var(--red)"></i>Fatal</span><span><i style="background:var(--amber)"></i>Prazo / cobrar</span><span><i style="background:var(--blue)"></i>Montar pasta</span><span><i style="background:var(--green)"></i>Audiência</span><span><i style="background:var(--line)"></i>Cadastro / solicitação</span></div></div>
  <div class="panel daylist">${side}</div></div>`;
}
function miniCard(it){const u=urgency(it);
  return `<div class="card" style="padding:9px 11px;gap:4px"><div class="card-top"><span class="who" style="font-size:13.5px">${esc(it.reclamante||"—")}</span><span class="pill ${u.cls}">${u.txt}</span></div><span class="proc">${esc(it.processo)}</span><span class="muted" style="font-size:12px">${TIPOS[it.tipo]}${it.quemCobrar?" · cobrar "+esc(it.quemCobrar):""}</span><div class="actions"><button class="btn small" data-goto="${it.tipo}" data-q="${esc(it.processo)}">Abrir</button></div></div>`}
function renderLista(tipo){
  const desc={prazo:"Prazos avulsos: apólices, GRUs, montagens urgentes, avisos.",docs:"Documentos que você pediu, com prazo fatal e o que falta na pasta.",semaud:"Processos novos já cadastrados, sem audiência marcada, aguardando documentos.",cadastro:"Cada check grava a data do clique. Completo, o processo muda de fila sozinho.",ok:"Processos com audiência cadastrada e na pauta."}[tipo];
  let L=items.filter(i=>i.tipo===tipo);
  const q=normName(search);if(q)L=L.filter(i=>normName(i.reclamante+" "+i.processo+" "+(i.assunto||"")+" "+(i.quemCobrar||"")).includes(q)||normProc(i.processo).includes(normProc(search)||"#"));
  if(tipo==="docs"&&docFilter.length)L=L.filter(i=>docFilter.every(d=>(i.faltando||[]).includes(d)));
  const open=L.filter(i=>!isDone(i)||tipo==="ok").sort(sortItems), done=tipo==="ok"?[]:L.filter(isDone);
  const filt=tipo==="docs"?`<div class="panel filters"><label>Filtrar por documento faltante</label><div class="chips">${CHECKLIST.map(d=>`<button class="chip f ${docFilter.includes(d)?"on":""}" data-df="${esc(d)}">${esc(d)}</button>`).join("")}</div></div>`:"";
  return `<div class="head"><div><h2>${TIPOS[tipo]}</h2><p>${desc}</p></div>${tipo!=="ok"?`<button class="btn primary" data-new="${tipo}">+ Adicionar</button>`:""}</div>
  <input class="search" id="search" placeholder="Buscar por reclamante, processo, assunto ou pessoa" value="${esc(search)}">
  ${filt}
  <div class="list">${open.length?open.map(card).join(""):`<div class="empty">${search||docFilter.length?"Nenhum resultado para esse filtro.":"Nada por aqui ainda. Use o Assistente ou “+ Adicionar”."}</div>`}</div>
  ${done.length?`<details><summary>${tipo==="prazo"?"Concluídos":"Enviados"} (${done.length})</summary><div class="list" style="margin-top:8px">${done.map(card).join("")}</div></details>`:""}`;
}
function chk(on,label,attrs,alt){return `<button class="check ${alt?"alt":""} ${on?"on":""}" ${attrs}><span class="box">${on?"✓":""}</span>${label}${on&&typeof on==="string"?` <small>${brs(on)}</small>`:""}</button>`}
function card(it){
  const u=urgency(it), c=it.checks||{};
  const meta=[["Solicitado",it.dataSolic],["Prazo",it.prazo],["Fatal",it.fatal],["Montar pasta",it.montarPasta],["Audiência",it.audiencia]].filter(x=>x[1]).map(([l,v])=>`<span>${l}: <b>${br(v)}</b></span>`).join("");
  let body="";
  if(it.tipo==="prazo") body=`<div class="actions">${chk(it.concluido,"Concluído",`data-tf="concluido" data-id="${it.id}"`)}</div>`;
  if(it.tipo==="docs"||it.tipo==="semaud") body=`<div class="actions">${chk(it.enviado,"Enviado",`data-tf="enviado" data-id="${it.id}"`)}</div>`;
  if(it.tipo==="docs") body+=`<details ${(it.faltando||[]).length?"":""}><summary>Documentos faltando (${(it.faltando||[]).length})</summary><div class="chips" style="margin-top:6px">${CHECKLIST.map(d=>`<button class="chip ${(it.faltando||[]).includes(d)?"on":""}" data-falta="${esc(d)}" data-id="${it.id}">${esc(d)}</button>`).join("")}</div></details>`;
  if((it.faltando||[]).length&&it.tipo==="docs") body=`<div class="meta"><span>Falta: <b>${it.faltando.map(esc).join(", ")}</b></span></div>`+body;
  if(it.tipo==="cadastro") body=`<div class="steps">${STEPS.map(([k,l])=>{
      let s=chk(c[k],l,`data-step="${k}" data-id="${it.id}"`);
      if(k==="contratos") s+=chk(c.contratosNA,"Não solicitado · cliente Pacaembu",`data-step="contratosNA" data-id="${it.id}"`,true);
      if(k==="audiencia") s+=chk(c.semAudiencia,"Não tem audiência marcada",`data-step="semAudiencia" data-id="${it.id}"`,true);
      return s}).join("")}</div>`;
  if(it.tipo==="ok") body=`<div class="meta"><span>Concluído em <b>${br(it.okEm)}</b></span></div>`;
  return `<article class="card ${isDone(it)&&it.tipo!=="ok"?"isdone":""}">
   <div class="card-top"><div><div class="who">${esc(it.reclamante||"Reclamante não informado")}</div><div class="proc">${esc(it.processo||"sem número")}</div></div><span class="pill ${u.cls}">${u.txt}</span></div>
   ${meta?`<div class="meta">${meta}</div>`:""}
   ${it.quemCobrar?`<div class="meta"><span>Quem cobrar: <b>${esc(it.quemCobrar)}</b></span></div>`:""}
   ${it.obs?`<p class="obs">${esc(it.obs)}</p>`:""}
   ${it.assunto?`<div class="assunto"><span><b>Assunto:</b> ${esc(it.assunto)}</span><button class="btn small ghost" data-copy="${esc(it.assunto)}">Copiar</button></div>`:""}
   ${body}
   <div class="actions" style="justify-content:flex-end"><button class="btn small ghost" data-edit="${it.id}">Editar</button><button class="btn small ghost" data-del="${it.id}">Excluir</button></div>
  </article>`;
}

/* ---------- modal ---------- */
function openForm(it,onSave){
  it=it?clone(it):{tipo:"prazo"};
  const f=(k,l,type="date")=>`<div class="fld"><label for="f_${k}">${l}</label><input id="f_${k}" type="${type}" value="${esc(it[k]||"")}"></div>`;
  modalRoot.innerHTML=`<div class="modal-bg" id="mbg"><form class="modal panel" id="mform"><h3>${it.id?"Editar":"Novo item"}</h3>
   <div class="fld"><label for="f_tipo">Campo</label><select id="f_tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${it.tipo===k?"selected":""}>${v}</option>`).join("")}</select></div>
   <div class="grid2">${f("reclamante","Reclamante","text")}${f("processo","Nº do processo","text")}</div>
   <div class="grid2">${f("dataSolic","Data da solicitação")}${f("prazo","Prazo (cobrar)")}${f("fatal","Prazo fatal")}${f("montarPasta","Montar pasta em")}${f("audiencia","Audiência")}${f("quemCobrar","Quem cobrar","text")}</div>
   ${f("assunto","Assunto do e-mail","text")}
   <div class="fld"><label for="f_obs">Observações</label><textarea id="f_obs" rows="3">${esc(it.obs||"")}</textarea></div>
   <div id="fdup"></div>
   <div class="actions" style="justify-content:flex-end"><button type="button" class="btn ghost" id="mcancel">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div>`;
  const upd=()=>{const p={processo:f_processo.value,reclamante:f_reclamante.value};const d=findDups(p);const others=x=>x.filter(i=>i.id!==it.id);
    const a=others(d.byProc),b=others(d.byName);fdup.innerHTML=(a.length||b.length?`<div class="dup">${a.length?`Já existe ${a.length} item com este processo (${a.map(i=>TIPOS[i.tipo]).join(", ")}).`:""} ${b.length?`Mesmo reclamante em outro processo: ${b.map(i=>esc(i.processo)).join(", ")}.`:""}</div>`:"")
      +dateWarnings(["dataSolic","prazo","fatal","montarPasta","audiencia"].map(k=>document.getElementById("f_"+k).value))};
  f_processo.oninput=upd;f_reclamante.oninput=upd;["dataSolic","prazo","fatal","montarPasta","audiencia"].forEach(k=>document.getElementById("f_"+k).addEventListener("input",upd));upd();
  mcancel.onclick=closeModal;mbg.onclick=e=>{if(e.target.id==="mbg")closeModal()};
  mform.onsubmit=e=>{e.preventDefault();["tipo","reclamante","processo","dataSolic","prazo","fatal","montarPasta","audiencia","quemCobrar","assunto","obs"].forEach(k=>it[k]=document.getElementById("f_"+k).value.trim()||null);
    if(!it.criadoEm)it.criadoEm=new Date().toISOString();closeModal();(onSave||saveItem)(it);toast("Salvo em "+TIPOS[it.tipo])};
}
function closeModal(){modalRoot.innerHTML=""}
let tt;function toast(m){clearTimeout(tt);let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2600)}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.rot){const t=today(),dia=dias[t]||{};
    if(d.rot==="manha"){saveDia(t,{manha:dia.manha?null:nowHM()});if(!dia.manha)toast("Tarefas da manhã enviadas às "+nowHM())}
    else{const on=!dia.fim;saveDia(t,{fim:on?nowHM():null,saida:on?nowHM():null});toast(on?"Saída registrada às "+nowHM():"Saída removida")}
    return}
  if(d.v){view=d.v;search="";statFilter=null;render();window.scrollTo({top:0})}
  else if(d.stat){drawer={stat:d.stat};render()}
  else if(d.dclose){drawer=null;render()}
  else if(d.newday)openForm({tipo:"prazo",prazo:d.newday});
  else if(d.cal!==undefined){if(d.cal==="0"){calMonth=today().slice(0,7);selDay=today()}else{const[y,m]=calMonth.split("-").map(Number);const n=new Date(y,m-1+Number(d.cal),1);calMonth=iso(n).slice(0,7)}render()}
  else if(d.day){selDay=d.day;drawer={day:d.day};render()}
  else if(d.tf)toggleField(d.id,d.tf);
  else if(d.step)toggleStep(d.id,d.step);
  else if(d.falta)toggleFalta(d.id,d.falta);
  else if(d.df!==undefined){docFilter=docFilter.includes(d.df)?docFilter.filter(x=>x!==d.df):[...docFilter,d.df];render()}
  else if(d.copy!==undefined)copy(d.copy);
  else if(d.edit)openForm(items.find(i=>i.id===d.edit));
  else if(d.new)openForm({tipo:d.new});
  else if(d.del){if(b.dataset.armed){removeItem(d.del);toast("Excluído")}else{b.dataset.armed="1";b.textContent="Confirmar exclusão";b.style.color="var(--red)";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Excluir";b.style.color=""}},3000)}}
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.id==="entrada"){saveDia(today(),{entrada:el.value||null});toast("Entrada registrada")}
  else if(el.dataset.pd){saveDia(el.dataset.pd,{[el.dataset.pk]:el.value||null});toast("Ponto atualizado")}});
document.addEventListener("input",e=>{if(e.target.id==="search"){search=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById("search");s.focus();s.setSelectionRange(pos,pos)}});

/* ---------- robozinho ---------- */
let pending=[];
function bot(html){const m=document.createElement("div");m.className="msg bot";m.innerHTML=html;msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight;return m}
function me(t){const m=document.createElement("div");m.className="msg me";m.textContent=t;msgs.appendChild(m);msgs.scrollTop=msgs.scrollHeight}
bot("Oi, Le! Me mande prazos, pedidos de documentos ou processos para cadastrar, um ou vários de uma vez. Eu separo reclamante, processo, datas, assunto e quem cobrar, e aviso se o processo já estiver no sistema.");

const SYS=`Você organiza tarefas de uma advogada trabalhista brasileira (construtora Pacaembu). Hoje é {HOJE}. Converta o texto em itens JSON.
Campos de cada item: tipo ("prazo" = prazo/tarefa avulsa como apólice, GRU, montar pasta, avisar alguém; "docs" = solicitação de documentos para montar pasta; "cadastro" = processo novo para cadastrar; "semaud" = processo já cadastrado sem audiência com docs solicitados), reclamante, processo (formato CNJ NNNNNNN-DD.AAAA.J.TR.OOOO), dataSolic, prazo (data de cobrança/prazo interno), fatal (prazo fatal), montarPasta, audiencia (todas as datas em AAAA-MM-DD; sem ano = ano corrente, ou próximo se já passou muito), quemCobrar (nome da pessoa a cobrar/avisar), assunto (assunto do e-mail, exato), obs (observação curta e clara), faltando (lista de documentos faltantes usando apenas: ${CHECKLIST.join("; ")}).
Se "prazo e fatal no mesmo dia", repita a data. Blocos separados por linhas de traços são itens distintos. Use null para o que não houver.
Responda só JSON: {"itens":[...],"resposta":"frase curta em português"}`;

function heuristic(text){
  const blocks=text.split(/\n\s*-{3,}\s*\n?/).map(s=>s.trim()).filter(Boolean);
  const yr=new Date().getFullYear();
  const toIso=s=>{const m=s.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);if(!m)return null;let y=m[3]?Number(m[3]):yr;if(y<100)y+=2000;return y+"-"+pad(m[2])+"-"+pad(m[1])};
  return blocks.map(b=>{
    const it={};const p=b.match(/\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}/);it.processo=p?p[0]:null;
    let r=b.match(/recla+ma?nte:?\s*([^\n]+)/i);if(r)it.reclamante=r[1].trim();else if(p){const after=b.slice(b.indexOf(p[0])+p[0].length).split("\n")[0].trim();if(after)it.reclamante=after}
    const fat=b.match(/fatal[^\d]{0,25}(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i);if(fat)it.fatal=toIso(fat[1]);
    if(/fatal no mes+mo dia/i.test(b)){const pz=b.match(/prazo[^\d]{0,12}(\d{1,2}\/\d{1,2})/i);if(pz){it.prazo=toIso(pz[1]);it.fatal=it.prazo}}
    const pz=b.match(/prazo[^\d]{0,12}(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i);if(pz&&!it.prazo)it.prazo=toIso(pz[1]);
    const sol=b.match(/solicit\w*\s+(?:dia\s+)?(\d{1,2}\/\d{1,2})/i);if(sol)it.dataSolic=toIso(sol[1]);
    const au=b.match(/audi[eê]ncia\s+(?:é\s+)?(?:dia\s+)?(\d{1,2}\/\d{1,2})/i);if(au)it.audiencia=toIso(au[1]);
    const mp=b.match(/montar pasta\s+(?:dia\s+)?(\d{1,2}\/\d{1,2})/i);if(mp)it.montarPasta=toIso(mp[1]);
    const cb=b.match(/cobrar\s+docs?\s+(?:dia\s+)?(\d{1,2}\/\d{1,2})/i);if(cb)it.prazo=toIso(cb[1]);
    const as=b.match(/(?:assunto|e-?mail(?:\/assunto)?)\s*:\s*([^\n(]+)/i)||b.match(/^\s*-\s*(Programa[^\n]+)/im);if(as)it.assunto=as[1].trim();
    const q=b.match(/(?:cobrar|avisar)\s+(?!docs?\b|documentos|dos\b|os\b)([A-ZÁÉÍÓÚÂÊÔÃÕ][\wÀ-ú]+(?:\s+[A-ZÁÉÍÓÚÂÊÔÃÕ][\wÀ-ú]+)?)/);if(q)it.quemCobrar=q[1];
    const ob=b.match(/observa[çc][õo]es:?\s*\n?([^\n]+)/i);it.obs=ob?ob[1].trim():null;
    it.tipo=/cadastr/i.test(b)&&!/cadastrei/i.test(b)?"cadastro":/solicit\w* (de )?doc|documentos/i.test(b)&&!/montar pasta e avisar/i.test(b)?"docs":"prazo";
    return it});
}
async function interpret(text){
  if(sample){
    const tela=view==="painel"?"":`\nA usuária está na tela "${TIPOS[view]}" (tipo "${view}"): use esse tipo quando o texto não deixar claro.`;
    try{const r=await sample.json([{role:"user",content:SYS.replace("{HOJE}",today())+tela+"\n\nTEXTO:\n"+text}],{modelTier:"default",cache:false});
      if(r&&Array.isArray(r.itens))return r}catch(e){if(e?.code==="not_granted")sample=null;aiMode.textContent="IA indisponível, usando leitura automática"}
  }
  return {itens:heuristic(text),resposta:"Li o texto assim. Confira os campos antes de salvar."};
}
function propHTML(p,i){
  const d=findDups(p);
  const dup=d.byProc.length?`<div class="dup">Atenção: processo já cadastrado (${d.byProc.map(x=>TIPOS[x.tipo]+(x.obs?" – "+esc(x.obs.slice(0,40)):"")).join("; ")}).</div>`:d.byName.length?`<div class="dup">Mesmo reclamante em outro processo: ${d.byName.map(x=>esc(x.processo)).join(", ")}.</div>`:"";
  const ds=[["Solic.",p.dataSolic],["Prazo",p.prazo],["Fatal",p.fatal],["Pasta",p.montarPasta],["Aud.",p.audiencia]].filter(x=>x[1]).map(x=>x[0]+" "+brs(x[1])).join(" · ");
  return `<div class="prop" data-pi="${i}"><div class="card-top"><b>${esc(p.reclamante||"Sem reclamante")}</b><select data-ptipo="${i}" aria-label="Campo">${Object.entries(TIPOS).filter(([k])=>k!=="ok").map(([k,v])=>`<option value="${k}" ${p.tipo===k?"selected":""}>${v}</option>`).join("")}</select></div>
   <span class="proc">${esc(p.processo||"sem número")}</span>${ds?`<span>${ds}</span>`:""}${p.quemCobrar?`<span>Cobrar: <b>${esc(p.quemCobrar)}</b></span>`:""}${p.assunto?`<span class="muted">Assunto: ${esc(p.assunto)}</span>`:""}${p.obs?`<span>${esc(p.obs)}</span>`:""}${(p.faltando||[]).length?`<span>Falta: ${p.faltando.map(esc).join(", ")}</span>`:""}
   ${dup}${dateWarnings([p.dataSolic,p.prazo,p.fatal,p.montarPasta,p.audiencia])}<div class="actions"><button class="btn small primary" data-psave="${i}">Salvar</button><button class="btn small" data-pedit="${i}">Editar</button><button class="btn small ghost" data-pdrop="${i}">Descartar</button></div></div>`;
}
composer.onsubmit=async e=>{e.preventDefault();const t=chatIn.value.trim();if(!t)return;me(t);chatIn.value="";sendBtn.disabled=true;
  const w=bot("Lendo…");const r=await interpret(t);sendBtn.disabled=false;
  const base=pending.length;const its=(r.itens||[]).map(x=>({...x,tipo:TIPOS[x.tipo]?x.tipo:"prazo",faltando:(x.faltando||[]).filter(d=>CHECKLIST.includes(d))}));pending.push(...its);
  if(!its.length){w.textContent="Não encontrei nenhuma tarefa nesse texto. Tente incluir o processo ou o reclamante.";return}
  w.innerHTML=`${esc(r.resposta||"Encontrei estes itens:")}<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;white-space:normal">${its.map((p,k)=>propHTML(p,base+k)).join("")}</div>${its.length>1?`<div class="actions" style="margin-top:8px"><button class="btn small primary" data-psaveall="${base}-${base+its.length}">Salvar todos</button></div>`:""}`;
  msgs.scrollTop=msgs.scrollHeight;
};
function setChat(open){chat.hidden=!open;fab.setAttribute("aria-expanded",open);fabTxt.textContent=open?"Fechar":"Assistente";if(open)setTimeout(()=>chatIn.focus(),30)}
fab.onclick=()=>setChat(chat.hidden);chatClose.onclick=()=>setChat(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(modalRoot.innerHTML)closeModal();else if(drawer){drawer=null;render()}else if(!chat.hidden)setChat(false)}});
chatIn.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))composer.requestSubmit()});
function commit(i){const p=pending[i];if(!p||p._saved)return;p._saved=true;const it={...p};delete it._saved;it.criadoEm=new Date().toISOString();saveItem(it);
  const el=document.querySelector(`[data-pi="${i}"]`);if(el)el.innerHTML=`<span style="color:var(--green);font-weight:600">✓ Salvo em ${TIPOS[it.tipo]}</span>`}
msgs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.psave)commit(+d.psave);
  if(d.psaveall){const[a,z]=d.psaveall.split("-").map(Number);for(let i=a;i<z;i++)commit(i);toast("Itens salvos");b.remove()}
  if(d.pdrop){pending[+d.pdrop]._saved=true;b.closest(".prop").innerHTML=`<span class="muted">Descartado</span>`}
  if(d.pedit){const i=+d.pedit;openForm(pending[i],it=>{pending[i]={...it};commit(i)})}
});
msgs.addEventListener("change",e=>{if(e.target.dataset.ptipo){pending[+e.target.dataset.ptipo].tipo=e.target.value}});

boot();
</script>
